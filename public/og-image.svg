<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="violet-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="emerald-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="40%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glows -->
  <ellipse cx="350" cy="250" rx="400" ry="300" fill="url(#glow1)"/>
  <ellipse cx="850" cy="400" rx="300" ry="250" fill="url(#glow2)"/>

  <!-- CPF Badge -->
  <g transform="translate(600, 140)">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
    <circle cx="-110" cy="0" r="8" fill="#10b981"/>
    <path d="M-114 0 L-112 2 L-106 -2" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="6" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Formation certifiante RS6228</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="260" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700">Formation Make</text>

  <!-- Subtitle with gradient -->
  <text x="600" y="340" text-anchor="middle" fill="url(#violet-gradient)" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="600">Automatisation No-Code</text>

  <!-- Description -->
  <text x="600" y="410" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="24">Reconvertissez-vous dans un metier d'avenir</text>

  <!-- CPF Price Badge -->
  <g transform="translate(600, 500)">
    <rect x="-120" y="-30" width="240" height="60" rx="12" fill="url(#emerald-gradient)"/>
    <text x="0" y="8" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700">100% finance CPF</text>
  </g>

  <!-- Logo bottom left -->
  <g transform="translate(60, 560)">
    <rect width="40" height="40" rx="10" fill="url(#violet-gradient)"/>
    <path d="M20 12 L20 20 L28 28 M20 20 L12 28" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="28" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">Apprendre Make</text>
  </g>

  <!-- URL bottom right -->
  <text x="1140" y="585" text-anchor="end" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="18">apprendremake.fr</text>

  <!-- Top border glow -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#violet-gradient)" opacity="0.6"/>
</svg>
